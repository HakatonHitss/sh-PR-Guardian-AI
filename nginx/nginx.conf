worker_processes auto;
#error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    #Cantidad de conexiones en simultaneo
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Evita exponer la versión de NGINX en la cabecera Server
    # y en las páginas de error generadas por NGINX.
    server_tokens off;

    # ---------------------------------------------------------------------
    # Redaccion del authorization code en el log de acceso
    # (Vulnerabilidad 5, CWE-598)
    #
    # Keycloak devuelve el code, state, session_state e iss en la query del
    # callback OIDC. Esos parametros son obligatorios por el protocolo y no se
    # pueden quitar sin romper el flujo, asi que el control no es sobre la URL
    # sino sobre los canales por los que se propaga. Este es el primero de los
    # tres: el log de acceso.
    #
    # El redaction se hace con map y captura, y no con
    # `access_log ... if=$loggable`, porque `if` suprime la linea COMPLETA.
    # Perder el codigo de estado y el tamano de la respuesta de los callbacks
    # deja el log inutil justo para diagnosticar fallos de autenticacion, que
    # es cuando mas hace falta consultarlo.
    #
    # Se redacta sobre $request_uri (la peticion ya recibida) y no sobre
    # $arg_code porque $arg_code es precisamente la entrada que se quiere
    # ocultar. map se evalua de forma perezosa, asi que para cuando se escribe
    # la linea del log $request_uri ya esta completo.
    #
    # Solo se redacta `code`: es la credencial que puede canjearse por un token.
    # `state` es el token anti-CSRF y `session_state` un identificador opaco; si
    # la politica de la organizacion exige redactarlos tambien, anadir dos
    # alternativas mas a este mismo map.
    # ---------------------------------------------------------------------
    map $request_uri $safe_uri {
        "~^(.*?)([?&])code=[^&]*(.*)$"  "$1$2code=REDACTED$3";
        default                         $request_uri;
    }

    # Log con la URL ya redactada. Se reconstruye la linea de peticion con
    # $request_method + $safe_uri + $server_protocol en lugar de usar $request,
    # porque $request es una cadena opaca que no admite sustitucion.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $safe_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    #access_log /etc/nginx/access.log main;
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}
