  <!--
    BLOQUE CRITICO DE ARRANQUE (V1 CSP: script-src sin 'unsafe-inline')
    ---------------------------------------------------------------------------
    Con optimization.styles.inlineCritical en true (valor por defecto), critters
    reescribe este index.html e inyecta un <style> inline, un <link onload="...">
    y un <script> inline. Ese script inline es la unica razon por la que la
    politica de CSP del despliegue necesita 'unsafe-inline' en script-src, y una
    politica con 'unsafe-inline' no mitiga XSS.

    Desactivando inlineCritical (angular.json) desaparecen los tres. Para no perder
    el pintado de la pantalla de carga (que ocurre ANTES de que corra Angular) se
    conserva aqui un bloque <style> critico y estatico, cubierto por un HASH sha256
    en la CSP en lugar de por 'unsafe-inline'.

    REGLAS DE MANTENIMIENTO IMPORTANTES:
      1. NO editar sin regenerar el hash: scripts/generate-csp.mjs lo calcula a
         partir del contenido exacto de este bloque y falla el build si no lo
         encuentra. El hash es sensible a espacios en blanco.
      2. NO usar var(--c-red-900) ni ninguna variable de @claro/ui/variables.css:
         este bloque debe ser autocontenido, porque el CSS del que dependen esas
         variables se sirve como archivo aparte y todavia no ha cargado.
         PENDIENTE DE VERIFICAR: confirmar el valor real de --c-red-900 en
         @claro/ui/variables.css y alinear el fondo de body con el, para que el
         salto de color al cargar styles-*.css sea imperceptible.
      3. Estas reglas se duplican a proposito en styles.css. Ahi son necesarias
         para el <app-loading-screen> que Angular renderiza DESPUES del bootstrap;
         aqui son necesarias para el HTML estatico previo al bootstrap.
  -->
  <style id="csp-critical">
    html,body{min-height:100%;margin:0}
    body{background-color:#FFFFFF}
    #sh-pr-guardian-ai-loading-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background-color:#F52717}
    #sh-pr-guardian-ai-loading-screen svg{display:block;width:min(220px,100%);height:auto}
    .loading-logo-accent{transform-box:fill-box;transform-origin:center;animation:loading-logo-pulse 1.4s ease-in-out infinite}
    .loading-logo-accent-1{animation-delay:0s}
    .loading-logo-accent-2{animation-delay:.16s}
    .loading-logo-accent-3{animation-delay:.32s}
    @keyframes loading-logo-pulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
  </style>
</head>
